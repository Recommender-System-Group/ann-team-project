<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title >Détail livre — Folio</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js"></script>
</head>
<body>
<nav>
    <a href="#" class="nav-logo">
  Fo<span class="dot">.</span>lio
</a>
  <ul class="nav-links">
    <li><a href="index.html">Catalogue</a></li>
    <li><a href="preferences.html">Mon profil</a></li>
    <li><a href="recommendations.html">Pour moi</a></li>
  </ul>
  <div class="nav-right">
    <span class="nav-user">Bonjour, <strong id="navUsername">—</strong></span>
    <button class="btn-logout" onclick="logout()">Déconnexion</button>
  </div>
</nav>

<div class="page">
  <div id="bookContent">
    <div class="loading-row"><span></span><span></span><span></span></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const session = requireAuth();
if (!session) window.location.href = 'login.html';
document.getElementById('navUsername').textContent = session.username || '—';

const bookId = new URLSearchParams(window.location.search).get('id');
console.log("ID =", bookId);
if (!bookId) window.location.href = 'index.html';

const genreColors = {
  'Horror': '#2d1b1b', 'Fantasy': '#1a2540', 'Fiction': '#1c2b1c',
  'Science Fiction': '#1a1a2e', 'Romance': '#2e1a22', 'Mystery': '#1e1e1e',
};

let userInteraction = { is_read: 0, rating: 0, review: '' };
let currentRating = 0;

async function loadBook() {
  const [book, reviews, inter] = await Promise.all([
    apiFetch('/books/' + encodeURIComponent(bookId)),
    apiFetch('/books/' + encodeURIComponent(bookId) + '/reviews'),
    apiFetch('/interactions?book_id=' + encodeURIComponent(bookId))
  ]);

  if (!book || book.error) {
    document.getElementById('bookContent').innerHTML =
      '<p style="text-align:center;padding:3rem;color:var(--ink-light)">Livre introuvable.</p>';
    return;
  }

  userInteraction = inter || { is_read: 0, rating: 0, review: '' };
  currentRating = userInteraction.rating || 0;
  renderBook(book, Array.isArray(reviews) ? reviews : []);
}

function starsHtml(rating, size = '1rem') {
  return [1,2,3,4,5].map(n =>
    `<span style="font-size:${size};cursor:pointer;color:${n<=rating?'var(--gold)':'var(--border)'}"
      onmouseover="hoverStar(${n})" onmouseout="resetStars()"
      onclick="selectRating(${n})">★</span>`
  ).join('');
}

function renderBook(book, reviews) {
  const bg = genreColors[book.genre] || '#2a2a2a';
  const isRead = userInteraction.is_read === 1;

  // Couverture : image réelle si disponible, sinon couleur genre
  const coverHtml = book.image_url
    ? `<img src="${book.image_url}" alt="${book.title}"
           style="width:100%;height:100%;object-fit:cover;border-radius:4px;"
           onerror="this.style.display='none';this.nextElementSibling.style.display='block'">`
    : '';
  const coverFallback = `
    <div style="display:${book.image_url ? 'none' : 'block'};text-align:center;padding:1.5rem">
      <div style="font-family:var(--serif);font-size:0.85rem;font-style:italic;
           color:rgba(255,255,255,0.7);line-height:1.4">${book.title}</div>
      <div style="width:30px;height:1px;background:rgba(255,255,255,0.3);margin:0.8rem auto"></div>
      <div style="font-family:var(--sans);font-size:0.7rem;color:rgba(255,255,255,0.5)">${book.author}</div>
    </div>`;

  document.getElementById('bookContent').innerHTML = `
    <div class="page-header">
      <p class="eyebrow">${book.genre || ''}</p>
      <h1>${book.title}</h1>
      <p>${book.author || ''}</p>
    </div>

    <div class="book-detail-grid">
      <div>
        <div class="book-detail-cover" style="background:${bg};overflow:hidden;">
          ${coverHtml}${coverFallback}
        </div>

        <div class="book-actions">
          <button class="btn-isread ${isRead ? 'read' : ''}" id="readBtn" onclick="toggleRead()">
            ${isRead ? '✓ Lu' : 'Marquer comme lu'}
          </button>

          <div style="padding:1rem;background:var(--white);border:1px solid var(--border)">
            <div style="font-family:var(--sans);font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-light);margin-bottom:0.6rem">Ma note</div>
            <div id="starRow" style="display:flex;gap:4px">${starsHtml(currentRating)}</div>
            <div style="font-family:var(--sans);font-size:0.75rem;color:var(--ink-light);margin-top:0.4rem" id="ratingLabel">
              ${currentRating > 0 ? currentRating + '/5' : 'Cliquez pour noter'}
            </div>
          </div>

          <div style="padding:1rem;background:var(--white);border:1px solid var(--border)">
            <div style="font-family:var(--sans);font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-light);margin-bottom:0.6rem">Mon avis</div>
            <textarea id="reviewInput" class="review-box" placeholder="Partagez votre avis sur ce livre..."
              style="min-height:90px;font-size:0.85rem">${userInteraction.review || ''}</textarea>
            <button onclick="submitReview()"
              style="margin-top:0.6rem;width:100%;background:var(--ink);color:var(--white);border:none;
              padding:0.6rem;font-family:var(--sans);font-size:0.78rem;letter-spacing:0.06em;
              text-transform:uppercase;cursor:pointer;border-radius:2px;transition:background 0.2s"
              onmouseover="this.style.background='var(--accent)'"
              onmouseout="this.style.background='var(--ink)'">
              Publier l'avis
            </button>
          </div>
        </div>
      </div>

      <div>
        <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem">
          <div style="background:#1a1a2e;border:1px solid var(--gold);border-radius:4px;padding:8px 12px;text-align:center">
            <div style="color:var(--gold);font-size:0.7rem">★</div>
            <div style="color:var(--gold);font-family:var(--serif);font-size:1.4rem;font-weight:600;line-height:1">${Number(book.avg_rating).toFixed(1)}</div>
            <div style="color:#888;font-size:0.65rem;font-family:var(--sans)">FolioDB</div>
          </div>
          <div>
            <div style="font-family:var(--sans);font-size:0.78rem;color:var(--ink-light)">Note moyenne</div>
            <div style="font-family:var(--sans);font-size:0.78rem;color:var(--ink-muted)">${reviews.length} avis sur FolioDB</div>
          </div>
        </div>

        <div style="font-family:var(--sans);font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-light);margin-bottom:0.8rem">Résumé</div>
        <p class="book-desc">${book.description || 'Aucune description disponible.'}</p>

        <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:2rem">
          <span class="rec-genre-tag">${book.genre || ''}</span>
        </div>

        <div style="border-top:1px solid var(--border);padding-top:2rem">
          <h3 style="font-family:var(--serif);font-size:1.2rem;margin-bottom:1.5rem">Avis des lecteurs</h3>
          ${reviews.length === 0
            ? `<p style="font-family:var(--body);font-style:italic;color:var(--ink-light)">Aucun avis pour l'instant. Soyez le premier !</p>`
            : reviews.map(r => `
              <div style="padding:1.2rem 0;border-bottom:1px solid var(--border)">
                <div style="display:flex;align-items:center;gap:0.8rem;margin-bottom:0.5rem">
                  <div style="width:32px;height:32px;border-radius:50%;background:#1a1a2e;display:flex;
                       align-items:center;justify-content:center;font-family:var(--sans);
                       font-size:0.75rem;color:var(--gold);font-weight:500">
                    ${r.username.charAt(0).toUpperCase()}
                  </div>
                  <div>
                    <div style="font-family:var(--sans);font-size:0.83rem;font-weight:500;color:var(--ink)">${r.username}</div>
                    <div style="font-size:0.7rem;color:var(--gold)">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
                  </div>
                  <div style="margin-left:auto;font-family:var(--sans);font-size:0.72rem;color:var(--ink-light)">
                    ${String(r.created_at).slice(0, 10)}
                  </div>
                </div>
                <p style="font-family:var(--body);font-size:0.88rem;color:var(--ink-muted);line-height:1.6;font-style:italic">"${r.review}"</p>
              </div>`).join('')
          }
        </div>
      </div>
    </div>`;
}

async function toggleRead() {
  const btn = document.getElementById('readBtn');
  const newVal = userInteraction.is_read === 1 ? 0 : 1;
  const res = await apiFetch('/interactions/read', {
    method: 'POST',
    body: JSON.stringify({ book_id: bookId })
  });
  if (!res || res.error) { showToast('Erreur, réessayez.'); return; }
  userInteraction.is_read = newVal;
  if (newVal === 1) {
    btn.textContent = '✓ Lu'; btn.classList.add('read');
    showToast('Marqué comme lu !', 'success');
  } else {
    btn.textContent = 'Marquer comme lu'; btn.classList.remove('read');
    showToast('Retiré des livres lus.');
  }
}

function hoverStar(n) {
  document.querySelectorAll('#starRow span').forEach((s, i) =>
    s.style.color = i < n ? 'var(--gold)' : 'var(--border)');
}

function resetStars() {
  document.querySelectorAll('#starRow span').forEach((s, i) =>
    s.style.color = i < currentRating ? 'var(--gold)' : 'var(--border)');
}

async function selectRating(n) {
  currentRating = n;
  document.getElementById('ratingLabel').textContent = n + '/5';
  resetStars();
  const res = await apiFetch('/interactions/rate', {
    method: 'POST',
    body: JSON.stringify({ book_id: bookId, rating: n })
  });
  if (res && !res.error) showToast(`Note ${n}/5 enregistrée !`, 'success');
  else showToast('Erreur lors de la notation.');
}

async function submitReview() {
  const review = document.getElementById('reviewInput').value.trim();
  if (review.length < 5) { showToast('Votre avis est trop court.'); return; }
  const res = await apiFetch('/interactions/review', {
    method: 'POST',
    body: JSON.stringify({ book_id: bookId, review })
  });
  if (res && !res.error) showToast('Avis publié !', 'success');
  else showToast('Erreur lors de la publication.');
}

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(() => t.classList.remove('show'), 2800);
}

loadBook();
</script>

</body>
</html>
